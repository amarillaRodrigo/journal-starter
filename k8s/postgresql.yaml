apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: journal-api
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: journal-api
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: journal-api
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # Misma ServiceAccount que la app: su 'sub' es el ExternalId que la
      # trust policy del rol de servicio acepta.
      serviceAccountName: journal-api
      initContainers:
        # Postgres toma la password de un archivo (POSTGRES_PASSWORD_FILE), no
        # de una variable de entorno: asi no queda en el spec del pod, que es
        # legible por cualquiera con get pods.
        - name: fetch-secrets
          # El tag se sustituye en el deploy (scripts/deploy-k8s.sh) por el commit SHA.
          image: 607856468834.dkr.ecr.us-east-1.amazonaws.com/journal-api:placeholder
          command:
            - python
            - /app/scripts/fetch_secrets.py
            - journal-api/credentials/database
          env:
            - name: AWS_RUNTIME_ROLE_ARN
              value: arn:aws:iam::607856468834:role/journal-api-runtime-role
            - name: AWS_REGION
              value: us-east-1
            - name: SECRETS_DIR
              value: /secrets
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          volumeMounts:
            - name: secrets
              mountPath: /secrets
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_DB
              value: "career_journal"
            - name: POSTGRES_PASSWORD_FILE
              value: /secrets/POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "192Mi"
              cpu: "500m"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: secrets
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: secrets
          emptyDir:
            medium: Memory
