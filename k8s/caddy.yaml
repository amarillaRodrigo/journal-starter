apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-config
  namespace: journal-api
data:
  Caddyfile: |
    {
        admin off
        email __ACME_EMAIL__
    }

    # sslip.io resuelve este nombre al Elastic IP de la instancia.
    # Caddy emite y renueva el certificado TLS automáticamente (Let's Encrypt).
    #
    # __PUBLIC_IP__ y __ACME_EMAIL__ los sustituye scripts/deploy-k8s.sh en
    # cada deploy: la IP la asigna Terraform (aws_eip) y cambia en cada
    # destroy/apply, y el email de ACME no se quiere en el repo.
    __PUBLIC_IP__.sslip.io {
        encode zstd gzip

        # HSTS (RFC 6797): el navegador queda obligado a hablar HTTPS con
        # este host durante un año, aunque el usuario escriba la URL en
        # claro. Sin esto, un atacante que controle la red puede responder
        # por HTTP y el navegador lo acepta: el TLS deja de ser el ancla.
        #
        # includeSubDomains extiende la politica a los subdominios del host.
        # En este proyecto no hay subdominios propios, pero sslip.io
        # resuelve cualquier etiqueta delante del IP al mismo servidor, asi
        # que la politica los cubre a todos.
        #
        # NO se agrega `preload`: la lista de preload de los navegadores
        # exige controlar el dominio registrable, y el host real
        # (3.215.52.10.sslip.io) no es de este proyecto. Anunciarlo sin
        # estar en la lista no aporta nada.
        header {
            Strict-Transport-Security "max-age=31536000; includeSubDomains"
        }

        reverse_proxy journal-api-service:8000
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: caddy-data
  namespace: journal-api
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  namespace: journal-api
  labels:
    app: caddy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: caddy
  template:
    metadata:
      labels:
        app: caddy
      annotations:
        # Checksum del manifiesto renderizado de Caddy. Lo calcula
        # scripts/deploy-k8s.sh en cada deploy.
        #
        # POR QUE HACE FALTA: Kubernetes SI actualiza el ConfigMap en el
        # volumen del pod (verificado el 2026-11-05: el archivo en disco
        # cambia a los ~50 s), pero Caddy NO vuelve a leerlo. El watcher de
        # Caddy sigue el inodo del archivo y el kubelet lo cambia de forma
        # atomica (swap del symlink ..data), asi que el watcher no se
        # dispara; y con `admin off` tampoco hay admin API para recargar.
        # Sin este checksum, `kubectl apply` actualiza el ConfigMap y el pod
        # sigue sirviendo la configuracion VIEJA, en silencio.
        #
        # El checksum va en el pod template: al cambiar, el template cambia y
        # Kubernetes hace el rollout del pod, que ya arranca con el
        # ConfigMap nuevo.
        caddyfile-checksum: "__CADDY_CHECKSUM__"
    spec:
      containers:
        - name: caddy
          image: caddy:2-alpine
          args:
            - caddy
            - run
            - --config
            - /etc/caddy/Caddyfile
            - --adapter
            - caddyfile
          ports:
            - name: http
              containerPort: 80
              hostPort: 80
            - name: https
              containerPort: 443
              hostPort: 443
          readinessProbe:
            httpGet:
              path: /version
              port: http
              httpHeaders:
                - name: Host
                  value: __PUBLIC_IP__.sslip.io
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "32Mi"
              cpu: "20m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          volumeMounts:
            - name: config
              mountPath: /etc/caddy
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: caddy-config
        - name: data
          persistentVolumeClaim:
            claimName: caddy-data
