apiVersion: v1
kind: Service
metadata:
  name: aspire-dashboard
  namespace: journal-api
spec:
  selector:
    app: aspire-dashboard
  ports:
  - name: http
    port: 18888
    targetPort: 18888
  - name: otlp-grpc
    port: 4317
    targetPort: 18889
  - name: otlp-http
    port: 4318
    targetPort: 18890
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aspire-dashboard
  namespace: journal-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aspire-dashboard
  template:
    metadata:
      labels:
        app: aspire-dashboard
    spec:
      containers:
      - name: aspire-dashboard
        image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
        ports:
        - containerPort: 18888
        - containerPort: 18889
        - containerPort: 18890
        env:
        - name: ASPIRE_DASHBOARD_ALLOW_UNAUTHENTICATED
          value: "true"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"