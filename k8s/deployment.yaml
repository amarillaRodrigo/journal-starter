apiVersion: apps/v1
kind: Deployment
metadata:
  name: journal-api
  namespace: journal-api
  labels:
    app: journal-api
spec:
  replicas: 1
  strategy:
    type: Recreate # nodo único pequeño: evita tener 2 pods consumiendo RAM a la vez
  selector:
    matchLabels:
      app: journal-api
  template:
    metadata:
      labels:
        app: journal-api
    spec:
      imagePullSecrets:
        - name: ecr-credential
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - until pg_isready -h postgres -U postgres; do echo "waiting for postgres"; sleep 2; done
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      containers:
        - name: journal-api
          # El tag se sustituye en el deploy (scripts/deploy-k8s.sh) por el commit SHA.
          image: 607856468834.dkr.ecr.us-east-1.amazonaws.com/journal-api:placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: journal-secrets
                  key: DATABASE_URL
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: journal-secrets
                  key: OPENAI_API_KEY
            - name: OPENAI_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: journal-secrets
                  key: OPENAI_BASE_URL
            - name: OPENAI_MODEL
              valueFrom:
                secretKeyRef:
                  name: journal-secrets
                  key: OPENAI_MODEL
          readinessProbe:
            httpGet:
              path: /version
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /version
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              memory: "96Mi"
              cpu: "100m"
            limits:
              memory: "320Mi"
              cpu: "700m"
