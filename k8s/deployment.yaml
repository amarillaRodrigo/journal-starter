apiVersion: apps/v1
kind: Deployment
metadata:
  name: journal-api
  namespace: journal-api
  labels:
    app: journal-api
spec:
  replicas: 1
  strategy:
    type: Recreate # nodo único pequeño: evita tener 2 pods consumiendo RAM a la vez
  selector:
    matchLabels:
      app: journal-api
  template:
    metadata:
      labels:
        app: journal-api
    spec:
      # El 'sub' del token de esta ServiceAccount es el ExternalId con el que
      # la app asume su rol de servicio (ver terraform/secrets.tf).
      serviceAccountName: journal-api
      imagePullSecrets:
        - name: ecr-credential
      initContainers:
        # Baja los secretos de AWS Secrets Manager con el rol de servicio de la
        # app y los deja en un emptyDir en memoria. El material sensible no
        # entra al Secret de Kubernetes (etcd, base64) ni al spec del pod.
        - name: fetch-secrets
          # El tag se sustituye en el deploy (scripts/deploy-k8s.sh) por el commit SHA.
          image: 607856468834.dkr.ecr.us-east-1.amazonaws.com/journal-api:placeholder
          command:
            - python
            - /app/scripts/fetch_secrets.py
            - journal-api/credentials/database
            - journal-api/credentials/llm
          env:
            - name: AWS_RUNTIME_ROLE_ARN
              value: arn:aws:iam::607856468834:role/journal-api-runtime-role
            - name: AWS_REGION
              value: us-east-1
            - name: SECRETS_DIR
              value: /secrets
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          volumeMounts:
            - name: secrets
              mountPath: /secrets
      containers:
        - name: journal-api
          # El tag se sustituye en el deploy (scripts/deploy-k8s.sh) por el commit SHA.
          image: 607856468834.dkr.ecr.us-east-1.amazonaws.com/journal-api:placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            # Las credenciales NO estan aqui: llegan por archivos en /secrets,
            # que el init container deja en un emptyDir en memoria.
            - name: SECRETS_DIR
              value: /secrets
            # Configuracion no sensible: un ConfigMap, no un Secret.
            - name: OPENAI_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: journal-config
                  key: OPENAI_BASE_URL
            - name: OPENAI_MODEL
              valueFrom:
                configMapKeyRef:
                  name: journal-config
                  key: OPENAI_MODEL
            # Pipeline de observabilidad: app -> OTLP -> ADOT -> X-Ray/CloudWatch.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://adot-collector:4318
            - name: OTEL_SERVICE_NAME
              value: journal-api
            - name: ENVIRONMENT
              value: production
          # Probes con periodSeconds altos a proposito: cada probe es un request
          # al pod. Con readiness cada 5s y liveness cada 15s eran 16 sondas por
          # minuto, todas contra /version, y cada una era un trace en X-Ray
          # (limite gratis: 100.000 traces/mes). A 10s y 30s el trafico de
          # sondas baja a 8 por minuto y el rollout sigue convergiendo igual.
          readinessProbe:
            httpGet:
              path: /version
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /version
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: "96Mi"
              cpu: "100m"
            limits:
              memory: "320Mi"
              cpu: "700m"
          volumeMounts:
            - name: secrets
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: secrets
          # medium: Memory => tmpfs. El secreto vive en RAM del pod: ni en el
          # disco del nodo ni en etcd.
          emptyDir:
            medium: Memory
