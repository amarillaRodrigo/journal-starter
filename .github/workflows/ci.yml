name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 607856468834.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: journal-api
# La URL publica NO se hardcodea: la IP la asigna Terraform (aws_eip) y cambia
# en cada destroy/apply. El job deploy la resuelve desde la instancia y la
# exporta como output.

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: career_journal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: career_journal
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/career_journal
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/career_journal_test
      OPENAI_API_KEY: ci-placeholder-not-used-by-mock
      OPENAI_BASE_URL: https://example.invalid/v1
      OPENAI_MODEL: ci-placeholder-not-used-by-mock
      # Tests sin exporters ni threads de red de OpenTelemetry.
      OTEL_SDK_DISABLED: "true"

    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks revisa el historial completo, no solo el ultimo commit:
          # un secreto filtrado sigue vivo en el historial aunque se borre.
          fetch-depth: 0

      - name: Scan the history for committed secrets (gitleaks)
        run: |
          set -euo pipefail
          GL_VERSION="8.30.1"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          # --redact no imprime el valor encontrado, solo donde esta.
          ./gitleaks detect --source . --redact --no-banner --verbose --exit-code 1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Initialize application and test databases
        run: |
          PGPASSWORD=postgres psql \
            -h localhost -U postgres -d career_journal \
            -v ON_ERROR_STOP=1 \
            -f database_setup.sql -f database_setup_test.sql

      - name: Run tests
        run: uv run pytest -m "not exercise" -v

  build:
    name: build
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # OIDC: credenciales efímeras, sin secretos estáticos

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::607856468834:role/journal-github-actions
          role-session-name: gha-build-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push commit-tagged image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest

  deploy:
    name: deploy
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: production
      # Link cosmetico del deployment. La verificacion funcional NO usa esta
      # variable: el job resuelve la IP real desde la instancia.
      url: ${{ vars.PUBLIC_URL }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::607856468834:role/journal-github-actions
          role-session-name: gha-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve the public URL from the instance
        id: publicurl
        run: |
          set -euo pipefail
          # La IP publica la asigna Terraform (aws_eip) y cambia en cada
          # destroy/apply, asi que no se hardcodea. Se resuelve desde la
          # instancia, que se busca por tag igual que en el paso de deploy.
          IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=journal-api-instance" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
          echo "IP publica: ${IP}"
          echo "url=https://${IP}.sslip.io" >> "$GITHUB_OUTPUT"

      - name: Deploy image to Kubernetes via SSM
        run: |
          set -euo pipefail

          # La instancia se resuelve por tag, así el ID no se hardcodea.
          IID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=journal-api-instance" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          echo "Instancia: $IID"

          cat > /tmp/ssm.json <<JSON
          {"commands":["cd /opt/journal-api && git fetch --depth 1 origin main && git reset --hard FETCH_HEAD && bash scripts/deploy-k8s.sh ${GITHUB_SHA}"]}
          JSON

          CID=$(aws ssm send-command \
            --instance-ids "$IID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy ${GITHUB_SHA}" \
            --parameters file:///tmp/ssm.json \
            --query 'Command.CommandId' --output text)
          echo "CommandId: $CID"

          STATUS="Pending"
          for i in $(seq 1 40); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" \
              --instance-id "$IID" --query Status --output text 2>/dev/null || echo Pending)
            echo "[$i] $STATUS"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          echo "===== stdout ====="
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" \
            --query StandardOutputContent --output text || true
          echo "===== stderr ====="
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" \
            --query StandardErrorContent --output text || true

          test "$STATUS" = "Success"

      - name: Verify the security properties on the instance
        run: |
          set -euo pipefail

          # Un deploy verde dice que el rollout convergió, no que la seguridad
          # siga en pie. Este paso corre las comprobaciones dentro de la
          # instancia: que el pod consuma el valor de Secrets Manager, que el
          # IAM siga denegando lo que debe y que no haya credenciales en
          # texto plano en el spec de los pods.
          IID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=journal-api-instance" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          echo "Instancia: $IID"

          CID=$(aws ssm send-command \
            --instance-ids "$IID" \
            --document-name "AWS-RunShellScript" \
            --comment "verify-security" \
            --parameters 'commands=["cd /opt/journal-api && bash scripts/verify-security.sh"]' \
            --query 'Command.CommandId' --output text)
          echo "CommandId: $CID"

          STATUS="Pending"
          for i in $(seq 1 40); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" \
              --instance-id "$IID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done

          echo "===== verify-security.sh ====="
          OUT=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" \
            --query StandardOutputContent --output text)
          echo "$OUT"

          # El exit code remoto no viaja en el Status, asi que el script deja
          # un sentinel explicito y el job lo busca.
          if ! printf '%s' "$OUT" | grep -q "RESULTADO_SEGURIDAD: OK"; then
            echo "::error::La verificacion de seguridad fallo (ver la salida arriba)"
            exit 1
          fi
          echo "OK: las propiedades de seguridad se cumplen"

      - name: Verify the public endpoint runs the new commit
        env:
          PUBLIC_URL: ${{ steps.publicurl.outputs.url }}
        run: |
          set -euo pipefail
          echo "Verificando ${PUBLIC_URL}"
          for i in $(seq 1 20); do
            COMMIT=$(curl -fsS "${PUBLIC_URL}/version" | python3 -c "import json,sys; print(json.load(sys.stdin)['commit'])" 2>/dev/null || true)
            echo "[$i] /version -> ${COMMIT:-<sin respuesta>}"
            if [ "${COMMIT}" = "${GITHUB_SHA}" ]; then
              echo "OK: Kubernetes está corriendo la imagen del commit ${GITHUB_SHA}"
              exit 0
            fi
            sleep 10
          done
          echo "ERROR: /version no coincide con ${GITHUB_SHA}"
          exit 1
